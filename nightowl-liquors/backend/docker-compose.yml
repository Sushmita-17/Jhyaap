services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jhyaap
      POSTGRES_USER: jhyaap
      POSTGRES_PASSWORD: jhyaap_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jhyaap -d jhyaap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles:
      - phase2

  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_jhyaap &&
             python manage.py runserver 0.0.0.0:8001"
    volumes:
      - ./django_app:/app
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started

volumes:
  postgres_data:
