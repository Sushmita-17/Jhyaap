[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# SPA routing - redirect all non-matching routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Prevent redirecting actual files and directories
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Cache headers for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache-busting for index.html
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
